name: Release

# Builds H8DIMGR Host for Windows, macOS and Linux. Pushing a version tag
# (e.g. 1.0.0 or v1.0.0) also publishes a GitHub release with the packages.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || v="0.0.0-dev"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: host/package.sh ${{ matrix.rid }} "$VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Host for **H8DIMGR4** on the Heathkit H8/H89: query, read and write H17 disk images over serial at 38,400 baud.

          Each package contains the desktop app (**H8DIMGR Host**) and the command line tool (`h8dimghost`). No .NET install is needed.

          | Platform | Download |
          |---|---|
          | Windows (64-bit) | `windows-x64.zip` |
          | macOS (Apple Silicon) | `macos-arm64.zip` |
          | macOS (Intel) | `macos-x64.zip` |
          | Linux (64-bit) | `linux-x64.tar.gz` |

          **macOS:** the app is not notarized. After unzipping, run
          `xattr -dr com.apple.quarantine "H8DIMGR Host.app"` once, or right-click the app and choose **Open**.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "H8DIMGR Host $GITHUB_REF_NAME" \
            --notes-file notes.md
